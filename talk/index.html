<script>
// ==========================================
// 1. 请将这里替换为你自己的 Twikoo 环境 ID
// ==========================================
const TWIKOO_ENV_ID = "https://twk.mooon.eu.org"; 

function toggleComment(memoUid) {
  const commentArea = document.getElementById(`comment-${memoUid}`);
  
  if (commentArea.classList.contains('active')) {
    commentArea.classList.remove('active');
    commentArea.innerHTML = ''; 
    return;
  }
  
  document.querySelectorAll('.bber-comment-area').forEach(el => {
    el.classList.remove('active');
    el.innerHTML = '';
  });
  
  commentArea.classList.add('active');
  commentArea.innerHTML = `<div id="twikoo-container-${memoUid}">正在加载 Twikoo...</div>`;
  
  if (typeof twikoo !== 'undefined') {
    twikoo.init({
      envId: TWIKOO_ENV_ID,
      el: `#twikoo-container-${memoUid}`,
      path: `/talk/memo-${memoUid}` 
    }).catch(err => {
      console.error('Twikoo 初始化失败:', err);
      commentArea.innerHTML = '加载评论失败，请检查环境配置。';
    });
  } else {
    commentArea.innerHTML = '<p style="color:red; font-size:14px;">等待 Twikoo 脚本加载或未找到相关文件...</p>';
  }
}

document.addEventListener("DOMContentLoaded", function() {
  // ==========================================
  // 2. 请将这里替换为你自己的 memos 链接
  // ==========================================
  const memosUrl = "https://memos.mooon.eu.org"; 
  const filterString = `visibility == 'PUBLIC'`;
  const apiUrl = `${memosUrl}/api/v1/memos?pageSize=50&filter=${encodeURIComponent(filterString)}`;

  fetch(apiUrl)
    .then(async response => {
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errText}`);
      }
      return response.json();
    })
    .then(data => {
      const memos = data.memos || [];
      const container = document.getElementById('bber');
      container.innerHTML = ''; 

      if (memos.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#999;">暂时没有哔哔赖赖~</p>';
        return;
      }

      memos.forEach(memo => {
        const d = new Date(memo.createTime);
        const createTime = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const memoUid = memo.name.split('/').pop() || memo.uid;
        
        const mediaList = memo.attachments || memo.resources || [];
        
        let contentHtml = memo.content
          .replace(/!\[.*?\]\(([^)\s]+)[^)]*\)/g, '<a href="$1" class="memo-lightbox-group" style="border-bottom:none !important; text-decoration:none !important;"><img src="$1" class="inline-img" alt="图片" loading="lazy" /></a>')
          .replace(/\n/g, '<br>');

        let resourcesHtml = '';
        
        // 核心改动：先精准过滤出纯图片，以便计算总数
        const imgList = mediaList.filter(res => {
          const fileType = res.type || res.contentType || res.mimeType || '';
          return fileType.startsWith('image/');
        });

        if (imgList.length > 0) {
          // 将图片总数量写入 data-count 属性，CSS会自动匹配对应的排版
          resourcesHtml += `<div class="bber-resources memo-lightbox-group" data-count="${imgList.length}">`; 
          imgList.forEach(res => {
            const imgUrl = `${memosUrl}/file/${res.name}/${res.filename}`;
            resourcesHtml += `<a href="${imgUrl}"><img src="${imgUrl}" alt="${res.filename}" loading="lazy" /></a>`;
          });
          resourcesHtml += '</div>';
        }
        
        const memoDiv = document.createElement('div');
        memoDiv.className = 'bber-item';
        memoDiv.innerHTML = `
          <div class="bber-time">${createTime}</div>
          <div class="bber-content">
            ${contentHtml}
            ${resourcesHtml}
          </div>
          <div class="bber-footer">
            <span class="bber-btn comment-btn" title="留言" onclick="toggleComment('${memoUid}')" style="margin-left: auto; color: #aaa;">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
              </svg>
            </span>
          </div>
          <div id="comment-${memoUid}" class="bber-comment-area"></div>
        `;
        container.appendChild(memoDiv);
      });

      new SimpleLightbox('.bber-content .memo-lightbox-group a', {
          overlayOpacity: 0.8, uniqueImages: true, showCounter: true, scrollZoom: false
      });
      
    })
    .catch(error => {
      console.error('获取 Memos 失败:', error);
      document.getElementById('bber').innerHTML = `<p style="text-align:center; color:red; font-size:12px; padding:20px;">
        <b>检测到真实报错：</b><br>
        ${error.message}<br><br>
        如果是 Failed to fetch，说明是 Cloudflare Worker 没生效（跨域拦截）；<br>
        如果是 HTTP 400/404/500 等代码，说明是 v0.28 接口参数或后端报错。
      </p>`;
    });
});
</script>
